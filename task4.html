<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
document.write("-- Multiplication Table of 5 --<br>");
for (var i = 1; i <= 5; i++) {
  document.write("5 x " + i + " = " + (5 * i) + "<br>");
}

document.write("-- First number > 10 divisible by 6 --<br>");
var n = 11;
while (true) {
  if (n % 6 === 0) {
    document.write("Found: " + n + "<br>");
    break;
  }
  n++;
}

document.write("-- Odd numbers from 1 to 9 --<br>");
var k = 0;
do {
  k++;
  if (k % 2 === 0) {
    continue;
  }
  document.write(k + "<br>");
} while (k < 9);
</script>
</body>
</html>
