<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
var name = "Alice";
let age = 25;
const isEmployed = true;
const skills = ["HTML", "CSS", "JavaScript"];

document.write("Name: " + name + " (Type: " + typeof name + ")<br>");
document.write("Age: " + age + " (Type: " + typeof age + ")<br>");
document.write("Is Employed: " + isEmployed + " (Type: " + typeof isEmployed + ")<br>");
document.write("Skills: " + JSON.stringify(skills) + " (Type: " + typeof skills + ")<br>");
</script>
</body>
</html>
